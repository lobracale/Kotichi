      <div class="presence">
        <strong>✕ User Not found</strong>
        <span>Join <a href="https://discord.gg/guns" target="_blank" rel="noopener noreferrer">discord.gg/guns</a> to display your status</span>

      <div class="socials">

            <strong>Emeraude - Aupinard</strong>

        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>

      <div class="views">◉ 14 <span>Profile Views</span></div>
    </section>
  </main>

  <audio id="audio" loop preload="metadata"
    src="https://r2.guns.lol/f5ea60df-dd59-4929-aa99-a3b1d695a12.mp3"></audio>

  <script src="script.js"></script>
