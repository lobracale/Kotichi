<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#00ff00"
  >

  <meta
    name="description"
    content="Kotichi Karma — Green Is Beautiful."

  <link rel="stylesheet" href="style.css">

<body>

  <!-- Écran d'entrée -->
  <div
    id="enter-screen"
    class="enter-screen"
    role="button"
    tabindex="0"
    aria-label="Entrer sur le profil"
  >
    <div class="enter-text">...</div>
  </div>

  <!-- Neige -->
  <div
    class="snow"
    aria-hidden="true"
  ></div>

  <!-- Contenu principal -->
  <main class="page">

    <section
      class="profile-card"
      aria-label="Profil de Kotichi Karma"
    >

      <!-- Avatar -->
      <img
        class="avatar"
        src=""
        alt="Avatar de Kotichi Karma"
        loading="eager"
      >

      <!-- Présentation -->
      <h1 class="username">
        Kotichi Karma
      </h1>

      <p class="subtitle">
        ⌖ Green Is Beautiful ⌖
      </p>

      <p class="location">
        °⌖° Greenland °⌖°
      </p>

      <!-- Réseaux -->
      <div class="socials">

        <a
          class="social"
          href="https://www.roblox.com/users/1305630552/profile"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Profil Roblox de Kotichi Karma"
        >
          <img
            src="https://i.pinimg.com/originals/d1/2a/eb/d12aeb087d5f9763cdf9619a618ad83c.gif"
            alt="Roblox"
            loading="lazy"
          >
        </a>

        <a
          class="social"

        >

            src="https://i.pinimg.com/originals/c2/2e/cd/c22ecdc6c1888ca6650d95c51030dddd.gif"
            alt="TikTok"
            loading="lazy"
          >
        </a>

        <a
          class="social"
          href="https://tracker.gg/valorant/profile/riot/Kotichi%23KARMA/overview?platform=pc&playlist=swiftplay&season=4f0864e2-40af-28a4-de2c-0e9e64e75f23"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Profil Valorant Tracker de Kotichi Karma"

            src="https://cdnb.artstation.com/p/assets/images/images/082/190/683/original/brendo-nascimento-green-fire-ezgif-com-optimize.gif?1732294311"
            alt="Valorant Tracker"
            loading="lazy"
          >
        </a>

        <a
          class="social"
          href="https://steamcommunity.com/profiles/76561198328568251"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Profil Steam de Kotichi Karma"
        >
          <img
            src="https://cdn.dribbble.com/userupload/30871207/file/original-2082ae1313bc57adc65bd2983459878b.gif"
            alt="Steam"
            loading="lazy"
          >
        </a>

      </div>

      <!-- Lecteur audio -->
      <div class="audio-player">

        <div class="track">

          <img
            src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/3322aa7a-0872-4e65-ad1f-bd7044febbb9/dicu33l-7ce73aa6-6009-4fd3-8d34-8d4578bfe7be.gif?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi8zMzIyYWE3YS0wODcyLTRlNjUtYWQxZi1iZDcwNDRmZWJiYjkvZGljdTMzbC03Y2U3M2FhNi02MDA5LTRmZDMtOGQzNC04ZDQ1NzhiZmU3YmUuZ2lmIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0._Fg19P99RfTxCRRB_xobG6TA6YlbFIYkbbp_ZFsITEg"
            alt="Illustration de la musique"
            loading="lazy"
          >

          <div>
            <strong>⌖ Emeraude - Aupinard ⌖</strong>
            <small>...⌖ Now playing ⌖...</small>
          </div>

        </div>

        <button
          id="play"
          type="button"
          aria-label="Lire la musique"
        >
          ▶
        </button>

        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Volume"
        >

      </div>

    </section>

  </main>

  <!-- Audio -->
  <audio
    id="audio"
    loop
    preload="metadata"
    src="https://r2.guns.lol/f5ea60df-dd59-4929-aa99-a3b1d695a12.mp3"
  ></audio>

  <!-- JavaScript -->
  <script src="script.js"></script>

</html>
